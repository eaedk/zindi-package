[package]
name = "zindi"
version = "1.0.0"
edition = "2021"
rust-version = "1.83"
description = "Async client for the Zindi data science competition platform: browse competitions, download data, submit, follow leaderboards and manage teams."
license = "MIT"
repository = "https://github.com/eaedk/zindi-package"
homepage = "https://eaedk.github.io/zindi-package/"
documentation = "https://docs.rs/zindi"
readme = "README.md"
keywords = ["zindi", "data-science", "machine-learning", "competition", "api"]
categories = ["api-bindings", "science"]
authors = [
    "Emmanuel Koupoh <emmanuelkoupoh@gmail.com>",
    "Muhamed Tuo",
    "Cédric Manouan",
]
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["std", "clock", "serde"] }
reqwest = { version = "0.12.9", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = { version = "1.0.120", features = ["preserve_order"] }
thiserror = "2.0.3"
tokio = { version = "1.38", features = ["fs", "io-util", "time"] }

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.38", features = ["fs", "io-util", "time", "macros", "rt-multi-thread"] }
wiremock = "0.6.2"
