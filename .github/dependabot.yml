version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: uv
    directory: /python
    schedule: { interval: monthly }
  - package-ecosystem: npm
    directory: /js
    schedule: { interval: monthly }
  - package-ecosystem: cargo
    directory: /rust
    schedule: { interval: monthly }
  - package-ecosystem: pip
    directory: /docs
    schedule: { interval: monthly }
