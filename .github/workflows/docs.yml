name: Docs

# The site is built and hosted by Read the Docs (https://zindi.readthedocs.io).
# This job only checks that the docs build without warnings on every change.
on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".readthedocs.yaml", "CONTRIBUTING.md", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", ".readthedocs.yaml", "CONTRIBUTING.md", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
