name: Release

# Push a tag to publish one package:
#   python-v1.0.0  -> PyPI      (trusted publishing, no token needed)
#   js-v1.0.0      -> npm       (NPM_TOKEN secret, published with provenance)
#   rust-v1.0.0    -> crates.io (CARGO_REGISTRY_TOKEN secret)
#   r-v1.0.0       -> GitHub release with the source tarball (CRAN is submitted by hand)
on:
  push:
    tags: ["python-v*", "js-v*", "rust-v*", "r-v*"]

permissions:
  contents: write

jobs:
  python:
    if: startsWith(github.ref_name, 'python-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Check the tag matches the version
        working-directory: python
        run: |
          version=$(uv run --no-project python -c "import re;print(re.search(r'\"(.+)\"', open('src/zindi/_version.py').read()).group(1))")
          test "python-v$version" = "$GITHUB_REF_NAME"
      - run: uv build
        working-directory: python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
      - uses: softprops/action-gh-release@v3
        with:
          files: python/dist/*
          generate_release_notes: true

  js:
    if: startsWith(github.ref_name, 'js-v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: test "js-v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  rust:
    if: startsWith(github.ref_name, 'rust-v')
    runs-on: ubuntu-latest
    environment: crates-io
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: test "rust-v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" = "$GITHUB_REF_NAME"
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  r:
    if: startsWith(github.ref_name, 'r-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
      - run: R CMD build r
      - uses: softprops/action-gh-release@v3
        with:
          files: zindi_*.tar.gz
          generate_release_notes: true
