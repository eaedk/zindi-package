[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "zindi"
dynamic = ["version"]
description = "Join Zindi competitions, download data, submit and climb the leaderboard from Python, the terminal or a notebook."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Emmanuel Koupoh", email = "emmanuelkoupoh@gmail.com" },
  { name = "Muhamed Tuo" },
  { name = "Cédric Manouan" },
]
maintainers = [{ name = "Emmanuel Koupoh", email = "emmanuelkoupoh@gmail.com" }]
keywords = ["zindi", "machine learning", "data science", "competitions", "kaggle-like", "cli", "africa"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: Jupyter",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "rich>=13.7",
  "typer>=0.12",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
notebook = ["ipywidgets>=8.0"]
all = ["pandas>=1.5", "ipywidgets>=8.0"]

[project.scripts]
zindi = "zindi.cli:main"

[project.urls]
Homepage = "https://github.com/eaedk/zindi-package"
Documentation = "https://eaedk.github.io/zindi-package/"
Repository = "https://github.com/eaedk/zindi-package"
Issues = "https://github.com/eaedk/zindi-package/issues"
Changelog = "https://github.com/eaedk/zindi-package/blob/main/python/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.10",
  "pandas>=1.5",
  "ipywidgets>=8.0",
]

[tool.hatch.version]
path = "src/zindi/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src/zindi", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/zindi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["live: talks to the real Zindi API (opt-in, needs credentials)"]
filterwarnings = ["error::DeprecationWarning:zindi.*"]

[tool.coverage.run]
source = ["zindi"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "C4", "PIE", "RET"]
ignore = ["B008"]  # typer uses function calls in argument defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT011", "PT018"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/zindi"]

[[tool.mypy.overrides]]
module = ["ipywidgets.*", "pandas.*", "google.*", "kaggle_secrets.*", "IPython.*", "tomli"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["zindi.notebook"]
disallow_untyped_calls = false
warn_return_any = false
